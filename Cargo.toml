[workspace]
members = [
    "crates/momentum-core",
    "crates/momentum-transport",
    "crates/momentum",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["null"]
repository = "https://example.invalid/momentum"
description = "Control Sennheiser MOMENTUM 4 headphones over GAIA/SPP"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossbeam-channel = "0.5"
humantime = "2.1"
libc = "0.2.150"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
